name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The version that wrote bun.lock; keep in step with packageManager in package.json.
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # The web app's dependencies are linked per workspace; the asset build and the web tests need them.
      - run: ls -la apps/web/node_modules apps/companion/node_modules && bun pm ls
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
        working-directory: apps/companion
      - run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
        working-directory: apps/companion
      - run: npm publish --provenance --access public
        working-directory: apps/companion
